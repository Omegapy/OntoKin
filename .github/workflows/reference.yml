name: OntoKin reference checks

on:
  workflow_dispatch:
    inputs:
      enable_hosted_ci:
        description: 'Run hosted jobs using the owner’s Actions allowance or paid budget'
        type: boolean
        required: true
        default: false

# Local checks are the default. Ordinary pushes and pull requests run no hosted jobs.
# See docs/engineering/OK-ENG-006-local-validation-and-hosted-ci-policy.md.

permissions:
  contents: read

jobs:
  reference:
    if: ${{ inputs.enable_hosted_ci == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Source, semantic, and numerical tests
        run: python -m unittest discover -s tests -v
      - name: Published source conformance
        run: python -m ontokin conformance --output /tmp/ontokin-conformance.json
      - name: Published agent-operation conformance
        run: python tools/run_agent_conformance.py --output /tmp/ontokin-agent-conformance.json
      - name: Current C01-C20 with immutable historical C20 and explicit identity status
        run: python -m tools.verify_construction_ci --output /tmp/ontokin-construction-conformance.json --external-evidence docs/engineering/construction-validation/external-gate.json
      - name: Native M01-M12 executed cases with explicit pending external attestation
        run: python tools/run_surface_conformance.py --allow-pending --output /tmp/ontokin-surface-conformance.json
      - name: Source impulse I01-I12 cases with explicit pending external attestation
        run: python tools/run_impulse_conformance.py --allow-pending --output /tmp/ontokin-impulse-conformance.json
      - name: Documentation preservation and links
        run: python docs/maintenance/reorganization-2026-10-17/verify_reorganization.py
      - name: Preserve source and agent conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ontokin-conformance-python-${{ matrix.python }}
          path: |
            /tmp/ontokin-conformance.json
            /tmp/ontokin-agent-conformance.json
            /tmp/ontokin-construction-conformance.json
            /tmp/ontokin-surface-conformance.json
            /tmp/ontokin-impulse-conformance.json
          retention-days: 14

  visual:
    name: GLB format and visual validation
    if: ${{ inputs.enable_hosted_ci == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install pinned verification tools
        run: npm ci --prefix tools --ignore-scripts
      - name: Export and independently validate prototype multi-material loft
        run: |
          python -m tools.build_surface_prototype --output-dir /tmp/ontokin-surface-prototype
          node tools/verify_surface_prototype.mjs /tmp/ontokin-surface-prototype/offset-taper.glb --output /tmp/ontokin-surface-validation.json
      - name: Compile native surface sources to GLB/0.3 and verify actual destination geometry
        run: |
          python tools/build_surface_demo.py --output-dir /tmp/ontokin-surface-native
          node tools/verify_surface_native.mjs --demo-dir /tmp/ontokin-surface-native --output /tmp/ontokin-surface-native-destination.json
      - name: Native agent source repair, composed surfaces, release and exact GLB retrieval
        run: |
          python tools/build_surface_agent_demo.py --output-dir /tmp/ontokin-surface-agent
          node tools/verify_surface_native.mjs --demo-dir /tmp/ontokin-surface-agent --output /tmp/ontokin-surface-agent-destination.json
      - name: Source impulse agent repair and independently decoded GLB/0.4 motion
        run: |
          python tools/build_impulse_agent_demo.py --output-dir /tmp/ontokin-impulse-agent
          node tools/verify_impulse_native.mjs --demo-dir /tmp/ontokin-impulse-agent --output /tmp/ontokin-impulse-destination.json
      - name: Build the viewer and all six source animations
        run: |
          npm run build-viewer --prefix tools
          python tools/build_visual_demos.py --include-conformance
      - name: Khronos format validation and Three.js numerical comparison
        run: node tools/verify_gltf.mjs examples/visual --output /tmp/ontokin-external-validation.json
      - name: Agent authoring, repair, evaluation and artifact retrieval
        run: python tools/build_agent_demo.py
      - name: Independently decode and validate the agent-produced GLB
        run: node tools/verify_gltf.mjs examples/agent --output /tmp/ontokin-agent-external-validation.json
      - name: Program-bundle authoring, generated-instance repair and artifact retrieval
        run: python tools/build_construction_demo.py
      - name: Independently validate construction GLB geometry and animation
        run: node tools/verify_gltf.mjs examples/construction --output /tmp/ontokin-construction-external-validation.json
      - name: Install the validation browser
        run: node tools/node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - name: Render and operate the offline viewer
        run: node tools/verify_viewer.mjs --output-dir /tmp/ontokin-viewer-validation
      - name: Render and operate the agent-produced animation
        run: node tools/verify_agent_viewer.mjs --output-dir /tmp/ontokin-agent-viewer-validation
      - name: Render and inspect all 126 construction poses
        run: node tools/verify_construction_viewer.mjs --output-dir /tmp/ontokin-construction-viewer-validation
      - name: Render native surfaces in front, side, and animated views
        run: node tools/verify_surface_viewer.mjs --demo-dir /tmp/ontokin-surface-native --output-dir /tmp/ontokin-surface-native-browser
      - name: Render native agent repairs, ordinary and generated composition, and rotated release
        run: >-
          node tools/verify_surface_viewer.mjs --demo-dir /tmp/ontokin-surface-agent
          --fixture palette-repaired --fixture composition-ordinary
          --fixture composition-generated --fixture rotated-release
          --output-dir /tmp/ontokin-surface-agent-browser
      - name: Render source impulses, release, physical repairs and high-spin motion
        run: >-
          node tools/verify_impulse_viewer.mjs --demo-dir /tmp/ontokin-impulse-agent
          --output-dir /tmp/ontokin-impulse-browser
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ontokin-visual-validation
          path: |
            /tmp/ontokin-external-validation.json
            /tmp/ontokin-surface-validation.json
            /tmp/ontokin-surface-prototype/offset-taper.glb
            /tmp/ontokin-surface-native
            /tmp/ontokin-surface-native-destination.json
            /tmp/ontokin-surface-native-browser
            /tmp/ontokin-surface-agent
            /tmp/ontokin-surface-agent-destination.json
            /tmp/ontokin-surface-agent-browser
            /tmp/ontokin-impulse-agent
            /tmp/ontokin-impulse-destination.json
            /tmp/ontokin-impulse-browser
            /tmp/ontokin-viewer-validation
            /tmp/ontokin-agent-external-validation.json
            /tmp/ontokin-agent-viewer-validation
            /tmp/ontokin-construction-external-validation.json
            /tmp/ontokin-construction-viewer-validation
            examples/construction/program.bundle.json
            examples/construction/workflow.json
            examples/construction/keyed-rack.glb
            examples/construction/keyed-rack.export.json
            examples/construction/keyed-rack.reference.json
            examples/agent/workflow.json
            examples/agent/repaired.glb
            examples/agent/repaired.export.json
            examples/agent/repaired.reference.json
          retention-days: 14
