name: OntoKin reference checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Source, semantic, and numerical tests
        run: python -m unittest discover -s tests -v
      - name: Published source conformance
        run: python -m ontokin conformance --output /tmp/ontokin-conformance.json
      - name: Documentation preservation and links
        run: python docs/maintenance/reorganization-2026-10-17/verify_reorganization.py
