[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontokin-reference"
version = "0.4.0"
description = "Revision-safe agent authoring, reference evaluation and glTF export for OntoKin core-0.1"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
ontokin = "ontokin.cli:main"

[tool.setuptools]
packages = ["ontokin", "_ontokin_reference_payload", "_ontokin_reference_payload.ontokin"]
include-package-data = false

[tool.setuptools.package-dir]
ontokin = "packaging/installed/ontokin"
"_ontokin_reference_payload" = "."
"_ontokin_reference_payload.ontokin" = "ontokin"

[tool.setuptools.package-data]
"_ontokin_reference_payload" = [
    "docs/engineering/reach-carrier-rotation-cursors.md",
    "docs/engineering/reach-coaxial-phase-bounds.md",
    "docs/engineering/reach-deferred-phase-locations.md",
    "docs/engineering/reach-destination-numerics.md",
    "docs/engineering/reach-numeric-kernel.md",
    "docs/engineering/reach-planning-reuse.md",
    "docs/engineering/reach-recording-certified-planar.md",
    "docs/engineering/reach-release-cell-envelope.md",
    "docs/engineering/reach-source-kernel.md",
    "docs/language-design/torque-amendments/c092-canonical-spin-selection/AMENDMENT.md",
    "docs/language-design/torque-amendments/c092-canonical-spin-selection/COMPATIBILITY.md",
    "docs/language-design/torque-amendments/c092-canonical-spin-selection/NUMERICAL-PROOF.md",
    "docs/language-design/torque-v0.1/RECORDING.md",
    "docs/language-design/torque-v0.1/SPECIFICATION.md",
    "tools/reach_destination.mjs",
    "tools/torque_destination.mjs",
]
