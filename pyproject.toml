[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontokin-reference"
version = "0.1.0"
description = "Headless reference prototype for the OntoKin core-0.1 language"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
ontokin = "ontokin.cli:main"

[tool.setuptools]
packages = ["ontokin"]
