[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontokin-reference"
version = "0.3.0"
description = "Revision-safe agent authoring, reference evaluation and glTF export for OntoKin core-0.1"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
ontokin = "ontokin.cli:main"

[tool.setuptools]
packages = ["ontokin"]
